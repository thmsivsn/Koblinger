<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0a0f2c" />
<title>Mattekamp</title>
<style>
  /* Layout: én skjerm om gangen. Menyer i kort på mørk nattblå bakgrunn, spill i fullskjerm. */
  :root{
    --bg1:#0a0f2c; --bg2:#1d1354; --card:rgba(255,255,255,.07); --card2:rgba(255,255,255,.12); --line:rgba(255,255,255,.14);
    --text:#f5f6ff; --muted:#a9b0d6; --ink:#10142e;
    --gold:#ffc83d; --cyan:#38d6ff; --pink:#ff5fa2; --green:#3ddc84; --red:#ff5a5f; --violet:#8f7bff;
    --p1:#38a0ff; --p2:#ff9a3d; --panel:#141a3d; --good:var(--green); --bad:var(--red); --skip:#eab308;
    --font:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%; margin:0}
  body{
    background:radial-gradient(120% 80% at 50% 0%, var(--bg2), var(--bg1) 70%) fixed var(--bg1); color:var(--text);
    font-family:var(--font); overflow:hidden; touch-action:manipulation; user-select:none; -webkit-user-select:none;
  }
  .hidden{display:none !important}
  button{font:inherit; color:inherit; border:0; background:none; cursor:pointer; padding:0}
  input,select{font:inherit; color:var(--text); background:rgba(0,0,0,.3); border:1.5px solid var(--line); border-radius:14px; padding:12px; min-height:48px; width:100%; user-select:text; -webkit-user-select:text}
  input:focus,select:focus,button:focus-visible{outline:3px solid var(--cyan); outline-offset:2px}

  /* Svevende mattesymboler bak menyene */
  #bgfx{position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0}
  #bgfx span{position:absolute; bottom:-12vh; font-weight:900; color:#fff; opacity:.07; animation:floatUp linear infinite}
  @keyframes floatUp{to{transform:translateY(-125vh) rotate(360deg)}}
  body.ingame #bgfx{display:none}
  #fx{position:fixed; inset:0; z-index:60; pointer-events:none; display:none}

  /* Skjermer */
  .screen{position:fixed; inset:0; z-index:1; display:none; flex-direction:column; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:calc(14px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left))}
  .screen.show{display:flex; animation:screenIn .32s ease-out}
  @keyframes screenIn{from{opacity:0; transform:translateY(14px)}}
  .wrap{width:100%; max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:14px}
  .topbar{display:flex; align-items:center; gap:10px; min-height:48px}
  .topbar h2{margin:0; font-size:24px; flex:1; text-wrap:balance}
  .back{width:46px; height:46px; border-radius:14px; background:var(--card); border:1.5px solid var(--line); font-size:22px; font-weight:900}
  .card{background:var(--card); border:1.5px solid var(--line); border-radius:22px; padding:16px; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px)}
  .lbl{font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 8px}
  .note{color:var(--muted); font-size:14px; line-height:1.45; margin:0}
  .warn{background:rgba(255,90,95,.16); border:1.5px solid rgba(255,90,95,.5); border-radius:14px; padding:10px 12px; font-size:14px; line-height:1.4}

  /* Knapper */
  .btn{display:flex; align-items:center; justify-content:center; gap:8px; min-height:52px; padding:10px 18px; border-radius:16px; font-weight:800; font-size:17px;
    background:var(--card2); border:1.5px solid var(--line); box-shadow:0 5px 0 rgba(0,0,0,.35); transition:transform .06s, box-shadow .06s}
  .btn:active{transform:translateY(4px); box-shadow:0 1px 0 rgba(0,0,0,.35)}
  .btn.gold{background:linear-gradient(180deg,#ffd964,#ffb41f); color:var(--ink); border-color:transparent; box-shadow:0 5px 0 #b97a00}
  .btn.gold:active{box-shadow:0 1px 0 #b97a00}
  .btn.green{background:linear-gradient(180deg,#5ff0a0,#27c46e); color:#06240f; border-color:transparent; box-shadow:0 5px 0 #15803d}
  .btn.danger{background:rgba(255,90,95,.18); border-color:rgba(255,90,95,.5)}
  .btn.big{min-height:62px; font-size:21px; width:100%}
  .btn:disabled{opacity:.4; transform:none}
  .row{display:flex; gap:10px; flex-wrap:wrap}
  .row > *{flex:1}
  .seg{display:flex; gap:6px; flex-wrap:wrap}
  .seg button{flex:1; min-width:64px; min-height:46px; padding:6px 10px; border-radius:13px; font-weight:800; background:rgba(0,0,0,.25); border:1.5px solid var(--line); color:var(--muted)}
  .seg button.on{background:var(--cyan); color:var(--ink); border-color:transparent}
  .chips button.on{background:var(--green)}

  /* Avatarer */
  .av{width:var(--s,48px); height:var(--s,48px); border-radius:50%; overflow:hidden; display:inline-block; flex:none; box-shadow:0 0 0 3px rgba(255,255,255,.2), 0 6px 14px rgba(0,0,0,.35); vertical-align:middle}
  .av svg{width:100%; height:100%; display:block}

  /* Intro */
  #intro{align-items:center; justify-content:center; gap:26px; text-align:center; overflow:hidden}
  .logo{font-weight:900; line-height:.92; letter-spacing:.02em; text-shadow:0 6px 0 rgba(0,0,0,.35)}
  .logo .l1{font-size:min(19vw,96px); color:#fff}
  .logo .l2{font-size:min(23vw,118px); background:linear-gradient(180deg,#ffe27a,#ff9a3d); -webkit-background-clip:text; background-clip:text; color:transparent; text-shadow:none; filter:drop-shadow(0 6px 0 rgba(0,0,0,.35))}
  .logo span{display:inline-block}
  #intro .l1 span{animation:drop .7s cubic-bezier(.3,1.5,.5,1) both}
  #intro .l2{animation:stamp .55s cubic-bezier(.2,1.6,.4,1) 1s both}
  @keyframes drop{from{transform:translateY(-110vh) rotate(-25deg); opacity:0}}
  @keyframes stamp{from{transform:scale(3.2) rotate(-8deg); opacity:0}}
  .introavs{display:flex; gap:10px; justify-content:center; flex-wrap:wrap}
  .introavs .av{--s:min(15vw,70px); animation:pop .5s cubic-bezier(.3,1.7,.5,1) both, bob 2.4s ease-in-out infinite}
  @keyframes pop{from{transform:scale(0) rotate(-40deg)}}
  @keyframes bob{50%{translate:0 -8px}}
  .tap{font-size:20px; font-weight:800; color:var(--gold); animation:fadeIn .5s 2.3s both, pulse 1.3s 2.8s ease-in-out infinite}
  @keyframes fadeIn{from{opacity:0}}
  @keyframes pulse{50%{opacity:.45; transform:scale(.97)}}
  #intro.leave{animation:leave .45s ease-in forwards}
  @keyframes leave{to{transform:scale(1.6); opacity:0}}
  .eqfly{position:absolute; font-weight:900; font-size:22px; color:var(--cyan); opacity:0; animation:eqfly 3.2s ease-in-out infinite}
  @keyframes eqfly{0%{opacity:0; transform:translateY(20px) scale(.6)}25%{opacity:.9}75%{opacity:.9}100%{opacity:0; transform:translateY(-40px) scale(1.1)}}

  /* Hjem */
  #home .logo{text-align:center; margin:6px 0 2px}
  #home .logo .l1{font-size:min(13vw,60px)} #home .logo .l2{font-size:min(16vw,74px)}
  .homeavs{display:flex; justify-content:center; gap:8px; min-height:52px; flex-wrap:wrap}
  .homeavs .av{--s:46px; animation:bob 2.6s ease-in-out infinite}
  .mode{display:flex; align-items:center; gap:14px; text-align:left; padding:16px; border-radius:22px; border:1.5px solid var(--line); box-shadow:0 6px 0 rgba(0,0,0,.35); transition:transform .06s, box-shadow .06s;
    background:linear-gradient(135deg, color-mix(in srgb, var(--mc) 55%, #10142e), color-mix(in srgb, var(--mc) 18%, #10142e))}
  .mode:active{transform:translateY(5px); box-shadow:0 1px 0 rgba(0,0,0,.35)}
  .mode .ico{font-size:40px; width:64px; height:64px; display:grid; place-items:center; border-radius:18px; background:rgba(0,0,0,.25); flex:none}
  .mode b{display:block; font-size:22px} .mode small{color:#dfe3ff; font-size:14px; line-height:1.3; display:block; margin-top:2px}
  #home.show .mode{animation:slideIn .45s cubic-bezier(.3,1.3,.5,1) both}
  #home.show .mode:nth-of-type(2){animation-delay:.07s} #home.show .mode:nth-of-type(3){animation-delay:.14s}
  @keyframes slideIn{from{opacity:0; transform:translateX(-40px)}}
  .nav{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
  .nav .btn{flex-direction:column; gap:2px; font-size:13px; min-height:64px; padding:8px 4px} .nav .btn i{font-style:normal; font-size:24px}

  /* Spillere */
  .pcard{display:flex; align-items:center; gap:14px; text-align:left; width:100%}
  .pcard .av{--s:64px}
  .pcard .info{flex:1; min-width:0}
  .pcard b{font-size:19px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .pcard small{color:var(--muted); font-size:13px; display:block}
  .xpbar{height:8px; border-radius:99px; background:rgba(0,0,0,.35); overflow:hidden; margin:6px 0 3px}
  .xpbar i{display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,var(--cyan),var(--violet))}
  .rank{color:var(--gold); font-weight:800; font-size:13px}

  /* Avatarbygger */
  .builder{display:flex; flex-direction:column; align-items:center; gap:12px}
  .builder .av{--s:min(40vw,150px)}
  .part{display:grid; grid-template-columns:46px 1fr 46px; align-items:center; gap:8px; width:100%}
  .part button{height:42px; border-radius:12px; background:rgba(0,0,0,.25); border:1.5px solid var(--line); font-size:20px; font-weight:900}
  .part span{text-align:center; font-weight:800} .part small{color:var(--muted); font-weight:600}
  .sw{display:flex; gap:8px; flex-wrap:wrap; justify-content:center}
  .sw button{width:36px; height:36px; border-radius:50%; border:3px solid transparent}
  .sw button.on{border-color:#fff; transform:scale(1.12)}
  .stepper{display:grid; grid-template-columns:52px 1fr 52px; gap:8px; align-items:center}
  .stepper button{height:48px; border-radius:14px; background:rgba(0,0,0,.25); border:1.5px solid var(--line); font-size:24px; font-weight:900}
  .stepper output{text-align:center; font-size:22px; font-weight:900}

  .bz{display:grid; grid-template-columns:repeat(2,1fr); gap:6px}
  .bz button{min-height:44px; padding:6px 10px; border-radius:12px; background:rgba(0,0,0,.25); border:2px solid var(--line); font-weight:800; font-size:14px; text-align:left}
  .bz button.on{border-color:var(--gold); background:rgba(255,200,61,.16)}
  #lvl{position:fixed; inset:0; z-index:45; background:rgba(5,6,18,.88); display:flex; align-items:center; justify-content:center; padding:20px}
  #lvl .card{width:min(100%,360px); display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center; background:#1a2050}
  #lvl .av{--s:84px} #lvl .stepper{width:100%} #lvl .row{width:100%}
  .pick button{-webkit-touch-callout:none}
  /* Oppsett: spillervelger */
  .pick{display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:8px}
  .pick button{position:relative; display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 4px 8px; border-radius:16px; background:rgba(0,0,0,.25); border:2px solid var(--line); min-width:0}
  .pick button .av{--s:52px}
  .pick button b{font-size:14px; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .pick button small{font-size:11px; color:var(--muted)}
  .pick button.on{border-color:var(--gold); background:rgba(255,200,61,.14)}
  .pick button .n{position:absolute; top:-7px; right:-5px; width:24px; height:24px; border-radius:50%; background:var(--gold); color:var(--ink); font-weight:900; font-size:14px; display:grid; place-items:center}
  .pick button.add{border-style:dashed; justify-content:center; color:var(--muted); font-weight:800; font-size:13px} .pick .add i{font-style:normal; font-size:30px; line-height:1}

  /* Historikk og resultater */
  .hrow{display:flex; flex-direction:column; gap:6px; padding:12px; border-radius:16px; background:rgba(0,0,0,.25); border:1.5px solid var(--line)}
  .hrow .top{display:flex; justify-content:space-between; gap:8px; color:var(--muted); font-size:12px; font-weight:700}
  .hrow .who{display:flex; align-items:center; gap:8px; font-weight:800; flex-wrap:wrap}
  .hrow .who .av{--s:28px} .win{color:var(--gold)}
  .lb{display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:14px; background:rgba(0,0,0,.25); font-weight:800}
  .lb .av{--s:34px} .lb .n{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap} .lb small{color:var(--muted)}
  .stack{display:flex; flex-direction:column; gap:8px}
  #results .hero{text-align:center; display:flex; flex-direction:column; align-items:center; gap:8px}
  #results .hero .av{--s:min(34vw,130px); animation:pop .6s cubic-bezier(.3,1.7,.5,1) both}
  #results h1{margin:0; font-size:32px; text-wrap:balance}
  .res{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:16px; background:rgba(0,0,0,.25); border:1.5px solid var(--line); animation:slideIn .4s both}
  .res .av{--s:44px} .res .m{font-size:26px; width:34px; text-align:center} .res .n{flex:1; min-width:0}
  .res b{display:block; font-size:18px} .res small{color:var(--muted); font-size:13px} .res .sc{font-weight:900; font-size:18px; text-align:right} .res .xp{color:var(--cyan); font-size:12px; font-weight:800}
  .toggle{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 0; width:100%; text-align:left; font-weight:700}
  .toggle + .toggle{border-top:1px solid var(--line)}
  .toggle i{width:54px; height:32px; border-radius:99px; background:rgba(0,0,0,.4); border:1.5px solid var(--line); position:relative; flex:none; transition:.15s}
  .toggle i::after{content:""; position:absolute; top:3px; left:3px; width:23px; height:23px; border-radius:50%; background:#fff; transition:.15s}
  .toggle.on i{background:var(--green)} .toggle.on i::after{left:25px}
  .toggle small{display:block; color:var(--muted); font-weight:600; font-size:13px}

  /* ---------- Felles spill-elementer ---------- */
  .mic{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); font-weight:800; min-height:34px}
  .mic i{width:12px; height:12px; border-radius:50%; background:#555; display:inline-block}
  .mic.on i{background:var(--red); animation:pulse 1.2s infinite}
  .keypad{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:6px auto; width:min(100%,380px)}
  .keypad button{min-height:min(6.5vh,52px); font-size:22px; font-weight:800; border-radius:12px; background:var(--card2); border:1.5px solid var(--line)}
  .typed{font-size:min(4.5vh,28px); font-weight:900; min-height:1.2em; letter-spacing:2px}
  .gbtn{min-height:42px; padding:6px 14px; border-radius:13px; font-weight:800; font-size:14px; background:var(--card2); border:1.5px solid var(--line)}
  .flash-bad{animation:shake .35s}
  @keyframes shake{0%,100%{translate:0}25%{translate:-10px}75%{translate:10px}}

  /* ---------- Duell (to halvdeler) ---------- */
  #duel{padding:0; overflow:hidden}
  #duel.show{animation:none}
  .half{flex:1; position:relative; display:flex; flex-direction:column; min-height:0; padding:12px 14px; transition:background .25s, opacity .25s; background:var(--panel)}
  .half.p2{transform:rotate(180deg); padding-top:calc(12px + env(safe-area-inset-bottom))}
  .half.p1{padding-bottom:calc(12px + env(safe-area-inset-bottom)); --pc:var(--p1)} .half.p2{--pc:var(--p2)}
  .half.active{background:color-mix(in srgb, var(--pc) 20%, var(--panel)); box-shadow:inset 0 0 0 4px var(--pc)}
  .half.flash-good{background:color-mix(in srgb, var(--good) 45%, var(--panel)) !important}
  .hud{display:flex; align-items:center; gap:10px; font-weight:800}
  .hud .name{color:var(--pc); font-size:18px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:44%; display:flex; align-items:center; gap:7px}
  .hud .av{--s:30px; box-shadow:0 0 0 2px var(--pc)}
  .prog{flex:1; display:flex; gap:4px; flex-wrap:wrap; justify-content:center; font-size:15px}
  .dot{width:12px; height:12px; border-radius:50%; background:#323a63}
  .dot.ok{background:var(--good)} .dot.skip{background:var(--skip)} .dot.now{box-shadow:0 0 0 2px var(--pc)}
  .clock{font-variant-numeric:tabular-nums; font-size:18px; min-width:70px; text-align:right}
  .clock.hurry{color:var(--bad)}
  .stage{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; min-height:0; text-align:center; overflow:hidden}
  .status{color:var(--muted); font-weight:800; font-size:16px; min-height:20px}
  .problem{font-weight:900; line-height:1.05; white-space:nowrap; font-variant-numeric:tabular-nums; font-size:min(11vh,22vw,calc(150vw / var(--len,5)))}
  .problem .q{color:var(--muted)}
  .half:not(.active) .problem{font-size:min(5vh,9vw,calc(70vw / var(--len,5))); color:var(--muted)}
  .heard{min-height:28px; font-size:20px; color:var(--muted); font-weight:700}
  .heard.bad{color:var(--bad)} .heard.good{color:var(--good); font-weight:900}
  .actions{display:flex; gap:8px; justify-content:center}
  .half:not(.active) .skip, .half.active .approve, .half:not(.active) .ear, .half:not(.active) .keypad{display:none}
  #duel.keys .half.active .problem{font-size:min(7vh,16vw,calc(110vw / var(--len,5)))}
  #duel.keys .half.active .status{display:none} #duel.keys .heard{min-height:20px; font-size:16px} #duel.keys .stage{gap:2px}
  .mid{flex:0 0 auto; height:46px; display:flex; align-items:center; justify-content:center; gap:14px; background:#070a1c; border-top:1px solid var(--line); border-bottom:1px solid var(--line)}
  .overlay{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; text-align:center; padding:16px; background:var(--panel); z-index:3}
  .overlay .big{font-size:min(20vh,40vw); font-weight:900; color:var(--pc)}
  .overlay h2{margin:0; font-size:min(6vh,34px)}
  .overlay .av{--s:min(12vh,84px)}
  .overlay .stats{color:var(--muted); font-size:min(2.6vh,17px); line-height:1.55} .overlay .stats b{color:var(--text)}
  .buzzer{display:none; width:min(20vh,36vw); height:min(20vh,36vw); border-radius:50%; margin-top:4px; color:var(--ink); font-size:min(4vh,22px); font-weight:900;
    background:radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--pc) 70%, white), var(--pc) 60%, color-mix(in srgb, var(--pc) 60%, black));
    border:4px solid color-mix(in srgb, var(--pc) 50%, black); box-shadow:0 8px 0 color-mix(in srgb, var(--pc) 45%, black), 0 12px 24px rgba(0,0,0,.4)}
  .buzzer:active{transform:translateY(6px); box-shadow:0 2px 0 color-mix(in srgb, var(--pc) 45%, black)}
  .buzzer:disabled{filter:grayscale(1) brightness(.5); transform:none}
  #duel.buzz .buzzer{display:block} #duel.buzz.answering .buzzer{display:none} #duel.buzz .skip{display:none}
  #duel.buzz:not(.answering) .approve{display:none}
  #duel.buzz .half:not(.active) .problem{font-size:min(10vh,20vw,calc(140vw / var(--len,5))); color:var(--text)}
  #duel.buzz .half.out{opacity:.55}

  /* ---------- Fest og trening (én retning) ---------- */
  #rr{overflow:hidden; gap:8px}
  .rrtop{display:flex; align-items:center; gap:10px}
  .rrtop .t{flex:1; text-align:center; font-weight:900; font-size:17px}
  .rrmain{flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; text-align:center; border-radius:26px; transition:background .2s}
  .rrmain.good{background:rgba(61,220,132,.22)}
  .ringwrap{position:relative; width:min(22vh,42vw); height:min(22vh,42vw); flex:none}
  .ring{position:absolute; inset:0; transform:rotate(-90deg)}
  .ring circle{fill:none; stroke-width:7} .ring .rbg{stroke:rgba(255,255,255,.12)} .ring .rfg{stroke:var(--cyan); stroke-linecap:round; stroke-dasharray:339.3; transition:stroke .2s}
  .ring.hurry .rfg{stroke:var(--red)}
  .ringwrap .av{position:absolute; inset:9%; width:auto; height:auto; box-shadow:none}
  .rrname{font-size:min(4.2vh,30px); font-weight:900}
  .rrsub{color:var(--gold); font-weight:800; min-height:22px; font-size:17px}
  .rrprob{font-weight:900; line-height:1.05; white-space:nowrap; font-variant-numeric:tabular-nums; font-size:min(12vh,20vw,calc(150vw / var(--len,5)))}
  .rrprob .q{color:var(--muted)}

<script>
'use strict';
if (window.AndroidBridge && !(window.webkit && window.webkit.messageHandlers)) {
  window.webkit = { messageHandlers: { speech: { postMessage: m => AndroidBridge.speech(String(m)) }, tts: { postMessage: t => AndroidBridge.tts(String(t)) } } };
}
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmtTime = ms => (ms / 1000).toFixed(1).replace('.', ',') + ' s';
const G = { mode: '', input: 'voice', ops: null, running: false, again: null };
let paused = false, pausedAt = 0;

/* =========================================================
   Oppgaver og tolking av norske tallord
   ========================================================= */
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[R(0, arr.length - 1)];
const fmt = n => (n < 0 ? '−' + (-n) : String(n));
const par = n => (n < 0 ? '(−' + (-n) + ')' : String(n));
const SUP = '⁰¹²³⁴⁵⁶⁷⁸⁹';
const sup = n => String(n).split('').map(d => SUP[d]).join('');
const P = (q, a, eq) => ({ q, a, eq: !!eq });

const GRADES = [
  null,
  { name: '1. klasse', info: 'Pluss og minus opp til 10',
    gen: [
      () => { const a = R(1, 9), b = R(1, 10 - a); return P(`${a} + ${b}`, a + b); },
      () => { const a = R(2, 10), b = R(1, a); return P(`${a} − ${b}`, a - b); },
    ] },
  { name: '2. klasse', info: 'Pluss og minus opp til 20, hele tiere, dobling',
    gen: [
      () => { const a = R(3, 15), b = R(2, 20 - a); return P(`${a} + ${b}`, a + b); },
      () => { const a = R(8, 20), b = R(2, a - 1); return P(`${a} − ${b}`, a - b); },
      () => { const a = 10 * R(1, 8), b = 10 * R(1, 9 - a / 10); return P(`${a} + ${b}`, a + b); },
      () => { const n = R(2, 10); return P(`${n} + ${n}`, 2 * n); },
    ] },
  { name: '3. klasse', info: 'Pluss og minus opp til 100, 2-, 5- og 10-gangen',
    gen: [
      () => { const a = R(11, 89), b = R(2, 9); return P(`${a} + ${b}`, a + b); },
      () => { const a = R(12, 99), b = R(2, 9); return P(`${a} − ${b}`, a - b); },
      () => { const a = R(11, 59), b = 10 * R(1, 4); return P(`${a} + ${b}`, a + b); },
      () => { const f = pick([2, 5, 10]), n = R(1, 10); return Math.random() < .5 ? P(`${f} × ${n}`, f * n) : P(`${n} × ${f}`, f * n); },
    ] },
  { name: '4. klasse', info: 'Hele gangetabellen, enkel deling, tosifret pluss/minus',
    gen: [
      () => { const a = R(2, 10), b = R(2, 10); return P(`${a} × ${b}`, a * b); },
      () => { const a = R(2, 10), b = R(2, 10); return P(`${a} × ${b}`, a * b); },
      () => { const b = R(2, 10), x = R(2, 10); return P(`${b * x} : ${b}`, x); },
      () => { const a = R(11, 60), b = R(11, 39); return P(`${a} + ${b}`, a + b); },
      () => { const a = R(30, 99), b = R(11, a - 5); return P(`${a} − ${b}`, a - b); },
    ] },
  { name: '5. klasse', info: 'Gangetabell, deling, ganging med 10 og 100, runde tall',
    gen: [
      () => { const a = R(3, 10), b = R(3, 10); return P(`${a} × ${b}`, a * b); },
      () => { const b = R(3, 10), x = R(3, 10); return P(`${b * x} : ${b}`, x); },
      () => { const a = R(2, 99), m = pick([10, 100]); return P(`${a} × ${m}`, a * m); },
      () => { const a = 10 * R(10, 60), b = 10 * R(5, 30); return P(`${a} + ${b}`, a + b); },
      () => { const a = 10 * R(30, 90), b = 10 * R(5, a / 10 - 5); return P(`${a} − ${b}`, a - b); },
    ] },
  { name: '6. klasse', info: 'Tosifret × ensifret, deling, 11- og 12-gangen',
    gen: [
      () => { const a = R(11, 25), b = R(2, 9); return P(`${a} × ${b}`, a * b); },
      () => { const b = R(2, 9), x = R(11, 25); return P(`${b * x} : ${b}`, x); },
      () => { const a = R(3, 12), b = R(3, 12); return P(`${a} × ${b}`, a * b); },
      () => { const n = 10 * R(2, 90); return P(`${n} : 10`, n / 10); },
      () => { const n = 10 * R(5, 95); return P(`1000 − ${n}`, 1000 - n); },
    ] },
  { name: '7. klasse', info: 'Negative tall, enkle prosenter, kvadrattall, regnerekkefølge',
    gen: [
      () => { const a = R(-10, 10), b = R(-10, 10); return P(`${fmt(a)} + ${par(b)}`, a + b); },
      () => { const a = R(1, 9), b = R(a + 1, 15); return P(`${a} − ${b}`, a - b); },
      () => { const p = pick([10, 50, 25]); const base = p === 10 ? 10 * R(2, 30) : p === 50 ? 2 * R(5, 60) : 4 * R(2, 30); return P(`${p} % av ${base}`, base * p / 100); },
      () => { const n = R(2, 12); return P(`${n}²`, n * n); },
      () => { const a = R(6, 12), b = R(6, 12); return P(`${a} · ${b}`, a * b); },
      () => { const a = R(1, 10), b = R(2, 6), c = R(2, 6); return P(`${a} + ${b} · ${c}`, a + b * c); },
    ] },
  { name: '8. klasse', info: 'Kvadrater og kvadratrøtter, prosent, regnerekkefølge, negative tall',
    gen: [
      () => { const n = R(2, 15); return P(`${n}²`, n * n); },
      () => { const n = R(2, 15); return P(`√${n * n}`, n); },
      () => { const p = pick([5, 10, 20, 25, 50, 75]); const step = 100 / gcd(p, 100); const base = step * R(2, Math.max(3, Math.floor(400 / step))); return P(`${p} % av ${base}`, base * p / 100); },
      () => { const a = R(2, 9), b = R(2, 9), c = R(2, 6); return P(`(${a} + ${b}) · ${c}`, (a + b) * c); },
      () => { const a = R(2, 9), b = R(2, 9), c = R(1, 20); return P(`${a} · ${b} − ${c}`, a * b - c); },
      () => { const a = R(2, 9), b = R(2, 9); return P(`(−${a}) · ${b}`, -a * b); },
      () => { const a = R(12, 39), b = R(2, 9); return P(`${a} · ${b}`, a * b); },
    ] },
  { name: '9. klasse', info: 'Potenser, enkle likninger, negative tall, prosent',
    gen: [
      () => { const [g, e] = pick([[2, R(2, 8)], [3, R(2, 4)], [5, R(2, 3)], [10, R(2, 4)]]); return P(`${g}${sup(e)}`, g ** e); },
      () => { const x = R(1, 12), a = R(2, 9), b = R(1, 20); return P(`${a}x + ${b} = ${a * x + b}`, x, true); },
      () => { const a = R(2, 9), b = R(2, 9); return P(`(−${a}) · (−${b})`, a * b); },
      () => { const a = R(1, 15), b = R(1, 15); return P(`${a} − (−${b})`, a + b); },
      () => { const p = pick([10, 20, 25, 30, 40, 75]); const step = 100 / gcd(p, 100); const base = step * R(2, Math.max(3, Math.floor(600 / step))); return P(`${p} % av ${base}`, base * p / 100); },
      () => { const n = R(4, 20); return P(`√${n * n}`, n); },
    ] },
  { name: '10. klasse', info: 'Likninger, potenser, kvadratrøtter, prosentvis endring',
    gen: [
      () => { let x; do { x = R(-9, 12); } while (x === 0); const a = R(2, 9), b = R(1, 20), c = a * x - b; return P(`${a}x − ${b} = ${fmt(c)}`, x, true); },
      () => { const a = R(2, 6), k = R(1, 10), b = R(1, 12); return P(`x/${a} + ${b} = ${k + b}`, a * k, true); },
      () => { const n = R(3, 15); return P(`x² = ${n * n},  x > 0`, n, true); },
      () => { const a = R(3, 12), b = R(1, a - 1); return P(`${a}² − ${b}²`, a * a - b * b); },
      () => { const a = R(2, 3), e = R(2, 4), m = R(2, 9); return P(`${a}${sup(e)} · ${m}`, (a ** e) * m); },
      () => { const p = pick([10, 20, 50]), base = 10 * R(2, 30); return P(`${base} økt med ${p} %`, base * (100 + p) / 100); },
      () => { const p = pick([10, 20, 50]), base = 10 * R(2, 30); return P(`${base} redusert med ${p} %`, base * (100 - p) / 100); },
      () => { const n = R(5, 25); return P(`√${n * n}`, n); },
    ] },
];
function gcd(a, b) { return b ? gcd(b, a % b) : a; }
/* Regnearter: hver oppgave klassifiseres ut fra tegnene den bruker */
const OPS = [
  { k: 'add', label: '➕ Pluss' }, { k: 'sub', label: '➖ Minus' },
  { k: 'mul', label: '✖️ Gange' }, { k: 'div', label: '➗ Deling' },
  { k: 'pct', label: '％ Prosent' }, { k: 'pow', label: 'x² Potenser og røtter' },
  { k: 'eq', label: 'x = ? Likninger' },
];
function opsOf(q) {
  if (/x/.test(q)) return ['eq'];
  if (/%/.test(q)) return ['pct'];
  const s = [];
  if (/[²³⁰¹⁴⁵⁶⁷⁸⁹√]/.test(q)) s.push('pow');
  if (/[×·]/.test(q)) s.push('mul');
  if (/:/.test(q)) s.push('div');
  if (/\+/.test(q)) s.push('add');
  if (/−/.test(q)) s.push('sub');
  return s;
}
/* Pluss, minus, gange og deling som blir vanskeligere med nivået */
const SCALED = {
  add: g => { const [a, b] = g <= 1 ? [R(1, 5), R(1, 5)] : g <= 2 ? [R(5, 15), R(2, 9)] : g <= 4 ? [R(12, 60), R(11, 39)] : g <= 6 ? [10 * R(12, 70), 10 * R(5, 29)] : g <= 8 ? [R(26, 89), R(26, 89)] : [R(120, 480), 10 * R(11, 45)]; return P(`${a} + ${b}`, a + b); },
  sub: g => {
    if (g >= 7) { const a = R(-20, 30), b = R(5, 40); return P(`${fmt(a)} − ${b}`, a - b); }
    const [a, b] = g <= 1 ? (x => [x, R(0, x)])(R(2, 10)) : g <= 2 ? (x => [x, R(2, x - 1)])(R(10, 20)) : g <= 4 ? (x => [x, R(11, x - 5)])(R(30, 99)) : (x => [x, 10 * R(5, x / 10 - 3)])(10 * R(30, 99));
    return P(`${a} − ${b}`, a - b);
  },
  mul: g => { const [a, b] = g <= 3 ? [pick([2, 5, 10]), R(1, 10)] : g <= 5 ? [R(2, 10), R(2, 10)] : g <= 7 ? [R(11, 25), R(2, 9)] : [R(12, 49), R(3, 9)]; const T = g >= 7 ? '·' : '×'; return P(`${a} ${T} ${b}`, a * b); },
  div: g => { const [b, x] = g <= 4 ? [R(2, 10), R(2, 10)] : g <= 6 ? [R(2, 9), R(11, 25)] : [R(3, 9), R(15, 45)]; return P(`${b * x} : ${b}`, x); },
};
function makeProblem(grade, prevQ, ops) {
  ops = ops || G.ops;
  const ok = p => Number.isInteger(p.a) && p.q !== prevQ && (!ops || opsOf(p.q).every(o => ops.includes(o)));
  // 1) Valgt nivå sine egne oppgaver
  for (let t = 0; t < 80; t++) { const p = pick(GRADES[grade].gen)(); if (ok(p)) return p; }
  // 2) De fire regneartene, skalert til nivået
  const basic = (ops || ['add', 'sub', 'mul', 'div']).filter(o => SCALED[o]);
  if (basic.length) for (let t = 0; t < 20; t++) { const p = SCALED[pick(basic)](grade); if (ok(p)) return p; }
  // 3) Nærmeste nivå som har de valgte regneartene (f.eks. likninger på lavt nivå)
  const order = [grade];
  for (let d = 1; d < 10; d++) { if (grade - d >= 1) order.push(grade - d); if (grade + d <= 10) order.push(grade + d); }
  for (const g of order) for (let t = 0; t < 60; t++) { const p = pick(GRADES[g].gen)(); if (ok(p)) return p; }
  let p, tries = 0;
  do { p = pick(GRADES[grade].gen)(); } while ((p.q === prevQ || !Number.isInteger(p.a)) && ++tries < 30);
  return p;
}

/* =========================================================
   2. Tolking av norske tallord («seksti fire», «fire og seksti», «64» …)
   ========================================================= */
const NUM = {
  null: 0, en: 1, 'én': 1, ett: 1, ei: 1, to: 2, tre: 3, fire: 4, fem: 5, seks: 6, sex: 6, sju: 7, syv: 7,
  'åtte': 8, ni: 9, ti: 10, elleve: 11, tolv: 12, tretten: 13, fjorten: 14, femten: 15, seksten: 16,
  sytten: 17, atten: 18, nitten: 19, tjue: 20, tyve: 20, tju: 20, tretti: 30, tredve: 30, 'førti': 40,
  femti: 50, seksti: 60, sytti: 70, 'søtti': 70, 'åtti': 80, nitti: 90, hundre: 100, hundrede: 100, tusen: 1000,
  // dialekt og vanlige feiltolkninger fra talegjenkjenning
  ein: 1, tri: 3, sjau: 7, otte: 8, 'åtta': 8, nie: 9, tjuge: 20, kjue: 20, 'førr': 40,
};
const KEYS = Object.keys(NUM).concat(['og', 'minus']).sort((a, b) => b.length - a.length);

function segment(word, i = 0) {           // deler opp sammensatte ord: «sekstifire» → [seksti, fire]
  if (i === word.length) return [];
  for (const k of KEYS) {
    if (word.startsWith(k, i)) {
      const rest = segment(word, i + k.length);
      if (rest) return [k, ...rest];
    }
  }
  return null;
}
const kindOf = v => v === 100 || v === 1000 ? 'mult' : v < 10 ? 'unit' : v < 20 ? 'teen' : (v < 100 && v % 10 === 0) ? 'tens' : 'complete';

/** Returnerer alle tall som kan leses ut av en setning. */
function parseNumbers(text) {
  let t = String(text).toLowerCase()
    .replace(/[−–—]/g, '-')
    .replace(/(\d)[\s.  ](?=\d{3}\b)/g, '$1')   // «10 000» → «10000»
    .replace(/(\d),(\d)/g, '$1.$2');
  const words = t.split(/[^0-9a-zæøåé.\-]+/).filter(Boolean);
  const toks = [];
  for (let w of words) {
    w = w.replace(/^\.+|\.+$/g, '');
    if (!w) continue;
    const m = w.match(/^(-?)(\d+(?:\.\d+)?)$/);
    if (m) { if (m[1]) toks.push('minus'); toks.push(Number(m[2])); continue; }
    if (w === '-') { toks.push('minus'); continue; }
    const seg = segment(w.replace(/-/g, ''));
    if (seg) seg.forEach(s => toks.push(s === 'og' || s === 'minus' ? s : NUM[s]));
    else toks.push(null);                 // vanlig ord – bryter et tall
  }
  const out = [];
  let cur = null, prev = null, og = false, minus = false;
  const close = () => { if (cur) out.push((cur.total + cur.current) * (cur.neg ? -1 : 1)); cur = null; prev = null; };
  for (const tok of toks) {
    if (tok === 'minus') { close(); minus = true; og = false; continue; }
    if (tok === 'og') { if (cur) og = true; continue; }
    if (tok === null) { close(); og = false; minus = false; continue; }
    const v = tok, k = kindOf(v);
    const compose = cur && (
      k === 'mult' || prev === 'mult' ||
      (prev === 'tens' && k === 'unit') ||
      (prev === 'unit' && k === 'tens' && og)           // «fire og seksti»
    );
    if (!compose) { close(); cur = { total: 0, current: 0, neg: minus }; minus = false; }
    if (v === 100) cur.current = (cur.current || 1) * 100;
    else if (v === 1000) { cur.total += (cur.current || 1) * 1000; cur.current = 0; }
    else cur.current += v;
    prev = k; og = false;
  }
  close();
  return out;
}

   Svar-inngang: stemme (tre varianter) og tastatur
   ========================================================= */
const noop = () => {};
const IN = { on: false, answer: null, heard: noop, correct: noop, wrong: noop, cmd: null, silence: null, ignoreFinalUntil: 0, token: 0, typed: '' };
function listenFor(answer, h) {

}

  if (!IN.on) return;

}
/* Glem det som er hørt til nå (ny oppgave, etter opplesing osv.) */
function fresh() {
  clearTimeout(IN.silence);
  if (NATIVE) NATIVE.postMessage('reset');
  else if (!Dict && Voice.rec) Voice.minIndex = Voice.len;
}
function checkCmd(heard) {
  if (!IN.cmd) return false;
  const c = /(^|\s)(pass|hopp over|vet ikke)(\s|$|[.,!?])/i.test(heard) ? 'pass' : /(^|\s)(gjenta|en gang til|si det igjen|igjen)(\s|$|[.,!?])/i.test(heard) ? 'repeat' : null;
  if (!c) return false;

}
function handleText(text, final) {

  const heard = String(text || '').trim();
  clearTimeout(IN.silence);
  if (!heard) return;
  const nums = parseNumbers(heard);
  if (nums.includes(IN.answer)) return gotCorrect();
  IN.heard(heard);
  if (checkCmd(heard)) return;
  if (final) { if (nums.length) IN.wrong(nums); return; }
  // Mange talemotorer (særlig iPhone) melder aldri «ferdig». En kort pause avslutter forsøket.
  const tok = IN.token;
  IN.silence = setTimeout(() => {
    if (!IN.on || IN.token !== tok || paused) return;
    handleText(heard, true);
    if (NATIVE) NATIVE.postMessage('reset');
  }, 1300);
}
function keyPress(k, disp) {
  if (!IN.on || paused) return;
  let t = IN.typed;
  if (k === '⌫') t = t.slice(0, -1);
  else if (k === '−') t = t.startsWith('-') ? t.slice(1) : '-' + t;
  else if (t.replace('-', '').length < 6) t += k;
  IN.typed = t; disp.textContent = t.replace('-', '−');
  const target = String(IN.answer);
  if (t === target) return gotCorrect();
  if (t !== '-' && t.replace('-', '').length >= target.replace('-', '').length && t.length >= target.length) {
    IN.wrong([Number(t)]); IN.typed = '';
    setTimeout(() => { if (!IN.typed) disp.textContent = ''; }, 300);
  }
}
const keypadHTML = () => [7, 8, 9, '⌫', 4, 5, 6, '−', 1, 2, 3, 0].map(k => `<button data-k="${k}">${k}</button>`).join('');

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const IN_ARTIFACT = !!(window.claude && window.claude.use);

let Dict = null, dictNoLang = false;

const Voice = {
  rec: null, wanted: false, minIndex: 0, len: 0,
  start() {

  _go() { try { this.rec.start(); } catch (e) {} },

    for (let j = 0; j < res.length; j++) if (parseNumbers(res[j].transcript).includes(IN.answer)) { Voice.minIndex = i + 1; return gotCorrect(); }

/* =========================================================
   DUELL: annenhver tur og buzzer (to halvdeler)
   ========================================================= */
const halves = [$('#duel .half.p1'), $('#duel .half.p2')];
const D = { starter: 1 };
halves.forEach((h, i) => {
  h.innerHTML = `
    <div class="hud"><span class="name"></span><div class="prog"></div><span class="clock"></span></div>
    <div class="stage"><div class="status"></div><div class="problem"></div><div class="heard"></div><div class="typed hidden"></div><button class="buzzer">BUZZ!</button></div>
    <div class="keypad hidden">${keypadHTML()}</div>
    <div class="actions"><button class="gbtn ear">👂 Hør på nytt</button><button class="gbtn skip">⏭ Hopp over (+5 s)</button><button class="gbtn approve">✓ Godkjenn motstanderens svar</button></div>
    <div class="overlay hidden"></div>`;
  h.querySelector('.skip').onclick = () => dSkip(i);

  h.querySelector('.approve').onclick = () => { if (D.turn !== i && IN.on) gotCorrect(); };
  h.querySelector('.buzzer').addEventListener('pointerdown', e => { e.preventDefault(); dBuzz(i); });

const dq = (i, sel) => halves[i].querySelector(sel);
function dHeard(i, text, cls) { const el = dq(i, '.heard'); el.textContent = text; el.className = 'heard ' + (cls || ''); }
const BUZZ_SECONDS = 3, BUZZ_GRACE = 700, QUESTION_TIMEOUT = 20000;

function startDuel(profs, variant, count, grade) {
  G.mode = 'duel'; G.rerender = dRender;
  Object.assign(D, { variant, count, players: profs.map(gp), starter: 1 - D.starter, awaiting: false, qIndex: 0, buzzer: -1, out: [false, false], between: false });
  D.turn = D.starter;
  if (variant === 'buzz') D.players.forEach(p => p.grade = grade); else D.players.forEach(p => p.cur = makeProblem(p.grade));
  $('#duel').classList.toggle('buzz', variant === 'buzz'); $('#duel').classList.remove('answering');
  halves.forEach(h => { h.querySelector('.overlay').classList.add('hidden'); h.classList.remove('flash-good'); });

}
function dCountdown(n) {
  if (!G.running) return;
  halves.forEach(h => {
    const o = h.querySelector('.overlay'); o.classList.remove('hidden');
    o.innerHTML = `<div class="big">${n || 'Kjør!'}</div><div class="stats">${D.variant === 'buzz' ? 'Fingeren klar på buzzeren!' : esc(D.players[D.turn].name) + ' starter'}</div>`;
  });

}
function dListen(i, onOk) {
  listenFor(D.players[i].cur.a, {

    correct: onOk,
    wrong: nums => { D.players[i].wrong++; dHeard(i, `Hørte ${nums.map(fmt).join(', ')} – ikke riktig`, 'bad'); sfx.bad(); const h = halves[i]; h.classList.remove('flash-bad'); void h.offsetWidth; h.classList.add('flash-bad'); },
  });

}

    const h = halves[i], active = D.turn === i && G.running;
    h.classList.toggle('active', active); h.classList.remove('out');
    dq(i, '.name').innerHTML = av(p.av) + ' ' + esc(p.name);
    dq(i, '.prog').innerHTML = Array.from({ length: D.count }, (_, k) => `<span class="dot ${p.log[k] || ''} ${k === p.done && active ? 'now' : ''}"></span>`).join('');

    dq(i, '.keypad').classList.toggle('hidden', !keys);

    dq(i, '.ear').classList.toggle('hidden', keys);

const RR = {};
const RR_GRACE = 700;
$('#rrKeys').innerHTML = keypadHTML();
$$('#rrKeys button').forEach(b => b.onclick = () => keyPress(b.dataset.k, $('#rrTyped')));
$('#rrSkip').onclick = () => { if (IN.on && !paused) rrPass('pass'); };

$('#rrRepeat').onclick = () => { if (G.running && !paused && (IN.on || RR.speaking)) { rrStopClock(); rrAsk(false, true); } };
function rrHeard(text, cls) { const el = $('#rrHeard'); el.textContent = text; el.className = 'heard ' + (cls || ''); }

function startRR(mode, profs, opt) {
  G.mode = mode; G.rerender = rrRender;
  Object.assign(RR, { players: profs.map(gp), count: opt.count || 0, limit: opt.limit || 0, sprint: !!opt.sprint, idx: -1, turnNo: 0, sprintLeft: 60000, token: 0, speaking: false, done: false });
  RR.total = RR.sprint ? Infinity : RR.count * RR.players.length;
  RR.read = mode === 'party' || !!DB.settings.readAloud;
  beginGame('rr'); rrRender();
  countdown(3, mode === 'party' ? `${RR.players[0].name} starter` : RR.sprint ? 'Så mange du klarer på 60 sekunder!' : 'Gjør deg klar!', rrNext);
}
function rrNext() {
  if (!G.running) return;
  if (RR.turnNo >= RR.total || (RR.sprint && RR.sprintLeft <= 0)) return rrFinish();
  RR.idx = (RR.idx + 1) % RR.players.length; RR.turnNo++;
  const p = RR.players[RR.idx];
  p.cur = makeProblem(p.grade, p.cur && p.cur.q);
  $('#rrMain').classList.remove('good'); rrHeard(''); $('#rrTyped').textContent = '';
  rrRender(); rrAsk(true);
}
async function rrAsk(announce, force) {
  const tok = ++RR.token, p = RR.players[RR.idx];
  stopListen(); clearTimeout(T.rTimer); clearInterval(T.rTick);
  if (RR.read || force) {
    RR.speaking = true; $('#rrSub').textContent = '🔊 Hør etter …';
    if (announce && G.mode === 'party') { playBuzz(p.buzz); await sleep(500); if (tok !== RR.token || !G.running || paused) return; }
    await speak((announce && RR.players.length > 1 ? `${p.name} sin tur. ` : '') + speakable(p.cur));
    if (tok !== RR.token || !G.running || paused) return;
    RR.speaking = false; fresh(); await sleep(220);
    if (tok !== RR.token || !G.running || paused) return;
  } else fresh();

}
function rrListen() {
  const p = RR.players[RR.idx];
  RR.span = RR.sprint ? RR.sprintLeft : RR.limit * 1000;
  RR.startAt = performance.now(); RR.lastTick = 99;
  listenFor(p.cur.a, {
    heard: t => rrHeard(`«${t}»`),
    correct: rrCorrect,
    wrong: nums => { p.wrong++; rrHeard(`Hørte ${nums.map(fmt).join(', ')} – ikke riktig`, 'bad'); sfx.bad(); const m = $('#rrMain'); m.classList.remove('flash-bad'); void m.offsetWidth; m.classList.add('flash-bad'); },
    cmd: c => { if (c === 'pass') rrPass('pass'); else { rrStopClock(); rrAsk(false, true); } },
  });
  if (RR.span > 0) T.rTimer = setTimeout(() => rrPass('time'), RR.span + (RR.sprint ? 0 : RR_GRACE));
  T.rTick = setInterval(rrTick, 50);
  rrRender(); rrTick();
}
function rrStopClock() {
  clearTimeout(T.rTimer); clearInterval(T.rTick);
  if (!IN.on || !RR.startAt) return;
  const el = performance.now() - RR.startAt;
  RR.players[RR.idx].time += el; if (RR.sprint) RR.sprintLeft -= el;
  RR.startAt = 0;
}
function rrTick() {
  if (!RR.startAt) return;
  const el = performance.now() - RR.startAt, fg = $('#rrFg'), ring = $('#rrRing');
  if (RR.span > 0) {
    const left = Math.max(0, RR.span - el), frac = left / (RR.sprint ? 60000 : RR.span);
    fg.style.strokeDashoffset = 339.3 * (1 - frac);
    const secs = Math.ceil(left / 1000);
    ring.classList.toggle('hurry', secs <= 3);
    if (secs <= 3 && secs > 0 && secs < RR.lastTick) sfx.tick();
    RR.lastTick = secs;
    if (RR.sprint) $('#rrTitle').textContent = `⏱ ${secs} s`;
  } else { fg.style.strokeDashoffset = 0; ring.classList.remove('hurry'); }
}
function rrCorrect() {
  rrFinishClockAfterCorrect();
  const p = RR.players[RR.idx], tok = ++RR.token;
  p.points++; p.correct++; p.streak++; p.maxStreak = Math.max(p.maxStreak, p.streak);
  sfx.ok(); $('#rrMain').classList.add('good');
  rrRender(); rrHeard(`✓ ${fmt(p.cur.a)} er riktig!`, 'good');
  (G.mode === 'party' ? speak('Riktig!') : sleep(550)).then(() => { if (tok === RR.token && G.running && !paused) rrNext(); });
}
function rrFinishClockAfterCorrect() {   // IN.on er allerede slått av når riktig svar meldes
  clearTimeout(T.rTimer); clearInterval(T.rTick);
  if (!RR.startAt) return;
  const el = performance.now() - RR.startAt;
  RR.players[RR.idx].time += el; if (RR.sprint) RR.sprintLeft -= el;
  RR.startAt = 0;
}
function rrPass(reason) {
  if (!G.running) return;

  const p = RR.players[RR.idx], tok = ++RR.token;
  p.streak = 0; p.skipped++;

  sfx.bad(); rrRender();
  rrHeard(`${reason === 'time' ? 'Tiden er ute!' : 'Pass.'} Svaret var ${fmt(p.cur.a)}`, 'bad');
  (RR.read ? speak(`${reason === 'time' ? 'Tiden er ute. ' : ''}Svaret var ${sayNum(p.cur.a)}.`).then(() => sleep(300)) : sleep(1500))

}
function rrRender() {
  const p = RR.players[Math.max(0, RR.idx)], keys = G.input === 'keys', party = G.mode === 'party';
  $('#rr').classList.toggle('keys', keys);
  $('#rrKeys').classList.toggle('hidden', !keys); $('#rrTyped').classList.toggle('hidden', !keys);
  $('#rrEar').classList.toggle('hidden', keys);

  if (!RR.sprint) $('#rrTitle').textContent = party ? `🎉 Runde ${Math.max(1, Math.ceil(RR.turnNo / RR.players.length))} av ${RR.count}` : `🎯 Oppgave ${Math.max(1, RR.turnNo)} av ${RR.count}`;
  else if (!RR.startAt) $('#rrTitle').textContent = `⏱ ${Math.ceil(Math.max(0, RR.sprintLeft) / 1000)} s`;
  $('#rrSub').textContent = RR.speaking ? '🔊 Hør etter …' : p.streak >= 2 ? `🔥 ${p.streak} på rad!` : party ? (keys ? 'Tast svaret' : 'Si svaret høyt') : `${GRADES[p.grade].name}`;

}
function rrPause() { rrStopClock(); stopListen(); RR.token++; RR.speaking = false; }

function rrFinish() {
  if (RR.done) return; RR.done = true;
  endGame();
  const party = G.mode === 'party';
  const order = [...RR.players].sort((a, b) => b.points - a.points || a.time - b.time);
  const top = order[0], tie = party && order.length > 1 && order[1].points === top.points && Math.abs(order[1].time - top.time) < 50;
  let record = false;

    <span class="sc">${score(p)}<div class="xp">+${p.xp} XP</div></span></div>`).join('');

      <div><p class="lbl">Tid per stykke</p>${seg('limit', [[5, '5 s'], [10, '10 s'], [15, '15 s'], [0, 'Ingen']])}</div></div>`;
  } else {
    h += `<div class="card stack"><div><p class="lbl">Øvelse</p>${seg('type', [['sprint', '⏱ 60 sekunder'], ['10', '🎯 10 stykker'], ['20', '🎯 20 stykker']])}</div>
      <p class="note">${S.type === 'sprint' ? 'Løs så mange du klarer på ett minutt og slå rekorden din.' : 'Løs alle stykkene så fort du kan.'}</p></div>`;
  }
  h += `<div class="card stack"><div><p class="lbl">Regnearter</p><div class="seg chips">${OPS.map(o => `<button data-op="${o.k}" class="${S.ops.includes(o.k) ? 'on' : ''}">${o.label}</button>`).join('')}</div></div>
    <div><p class="lbl">Svar med</p>${seg('input', [['voice', '🎤 Stemme'], ['keys', '⌨️ Tastatur']])}</div>
    ${voice ? '' : `<div class="warn">${IN_ARTIFACT ? 'Stemme virker ikke i denne visningen. Bruk iPhone-appen, eller Chrome på Android eller PC.' : 'Denne nettleseren støtter ikke talegjenkjenning.'} Spillet bruker tastatur.</div>`}</div>`;
  $('#suBody').innerHTML = h;
  $('#suStart').disabled = S.sel.length < min;
  $('#suStart').textContent = S.sel.length < min ? (min === 2 ? 'Velg minst to spillere' : 'Velg en spiller') : 'Start!';
  const g = $('#suGrade'); if (g) g.onchange = () => { S.grade = +g.value; };
}
/* Hold inne på en spiller: nivå bare for denne kampen */
let lpTimer = null, lpFired = false, lpXY = null, lvlId = null;
const lpCancel = () => { clearTimeout(lpTimer); lpTimer = null; };
$('#suBody').addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-pick]'); if (!b) return;
  lpFired = false; lpXY = [e.clientX, e.clientY]; lpCancel();
  lpTimer = setTimeout(() => { lpFired = true; sfx.pop(); openLvl(b.dataset.pick); }, 550);
});
$('#suBody').addEventListener('pointermove', e => { if (lpTimer && lpXY && Math.hypot(e.clientX - lpXY[0], e.clientY - lpXY[1]) > 12) lpCancel(); });
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => $('#suBody').addEventListener(ev, lpCancel));
$('#suBody').addEventListener('contextmenu', e => { if (e.target.closest('[data-pick]')) e.preventDefault(); });
function openLvl(id) { lvlId = id; drawLvl(); $('#lvl').classList.remove('hidden'); }
function drawLvl() {
  const p = prof(lvlId), g = S.lvl[lvlId] || p.grade;
  $('#lvlAv').innerHTML = av(p.av); $('#lvlName').textContent = p.name;
  $('#lvlOut').textContent = GRADES[g].name;
  $('#lvlInfo').textContent = GRADES[g].info + (g !== p.grade ? ` (Lagret nivå: ${GRADES[p.grade].name})` : '');
}
const lvlStep = d => { const p = prof(lvlId); S.lvl[lvlId] = Math.max(1, Math.min(10, (S.lvl[lvlId] || p.grade) + d)); sfx.pop(); drawLvl(); };
$('#lvlDown').onclick = () => lvlStep(-1); $('#lvlUp').onclick = () => lvlStep(1);
$('#lvlReset').onclick = () => { delete S.lvl[lvlId]; drawLvl(); };
$('#lvlDone').onclick = () => { $('#lvl').classList.add('hidden'); if (!S.sel.includes(lvlId) && S.sel.length < LIMITS[S.mode][1]) S.sel.push(lvlId); renderSetup(); };

$('#suBody').addEventListener('click', e => {
  if (lpFired) { lpFired = false; return; }
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.pick) pickPlayer(b.dataset.pick);
  else if (b.dataset.add !== undefined) return openEditor(null, 'setup');
  else if (b.dataset.set) { const k = b.dataset.set, v = b.dataset.v; S[k] = (k === 'count' || k === 'limit') ? +v : v; }
  else if (b.dataset.op) { const k = b.dataset.op, i = S.ops.indexOf(k); if (i >= 0) { if (S.ops.length > 1) S.ops.splice(i, 1); } else S.ops.push(k); }
  else return;
  sfx.click(); renderSetup();
});
$('#suStart').onclick = () => {
  const profs = S.sel.map(prof).filter(Boolean), m = S.mode;
  if (profs.length < LIMITS[m][0]) return;
  DB.last[m] = { sel: S.sel.slice(), variant: S.variant, count: S.count, grade: S.grade, limit: S.limit, type: S.type, lvl: { ...S.lvl } };
  DB.last.input = S.input; DB.last.ops = S.ops.slice(); save();
  const cfg = JSON.parse(JSON.stringify(S));
  G.again = () => {
    const ps = cfg.sel.map(prof).filter(Boolean).map(p => ({ ...p, grade: cfg.lvl[p.id] || p.grade }));
    if (ps.length < LIMITS[cfg.mode][0]) return toMenu();
    G.input = canVoice() ? cfg.input : 'keys'; G.ops = cfg.ops;
    if (cfg.mode === 'duel') startDuel(ps, cfg.variant, cfg.count, cfg.grade);
    else if (cfg.mode === 'party') startRR('party', ps, { count: cfg.count, limit: cfg.limit });
    else startRR('train', ps, cfg.type === 'sprint' ? { sprint: true } : { count: +cfg.type });
  };
  G.again();
};

/* ---------- Historikk ---------- */
const MODE_NAME = { tur: '🔁 Duell', buzz: '🔔 Buzzer', fest: '🎉 Fest', tren: '🎯 Trening' };
RENDER.history = () => {
  const h = DB.history, body = $('#histBody');
  if (!h.length) { body.innerHTML = '<div class="card"><p class="note">Ingen kamper ennå. Spill en runde, så dukker den opp her.</p></div>'; return; }
  const tally = {};
  h.filter(m => m.mode !== 'tren').forEach(m => m.rows.forEach(r => {
    const k = r.id || r.name; tally[k] = tally[k] || { name: r.name, av: r.av, games: 0, wins: 0 };
    const p = prof(r.id); if (p) { tally[k].name = p.name; tally[k].av = p.av; }
    tally[k].games++; if (r.win) tally[k].wins++;
  }));
  const board = Object.values(tally).sort((a, b) => b.wins - a.wins || b.games - a.games).slice(0, 8);
  const dt = new Intl.DateTimeFormat('nb-NO', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  body.innerHTML = (board.length ? `<div class="card"><p class="lbl">Flest seire</p><div class="stack">${board.map((r, n) => `<div class="lb"><span>${['🥇', '🥈', '🥉'][n] || '&nbsp;' + (n + 1) + '.'}</span>${av(r.av)}<span class="n">${esc(r.name)}</span><span>${r.wins}</span><small>av ${r.games}</small></div>`).join('')}</div></div>` : '')
    + `<div class="card"><p class="lbl">Alle kamper (${h.length})</p><div class="stack">${h.map(m => `<div class="hrow"><div class="top"><span>${dt.format(new Date(m.t))}</span><span>${MODE_NAME[m.mode] || ''}${m.count ? ' · ' + m.count + ' stk' : ''}</span></div>
      ${m.rows.map(r => `<div class="who">${av(r.av)}<span class="${r.win ? 'win' : ''}" style="flex:1">${esc(r.name)}${r.win ? ' 🏆' : ''}</span><span>${esc(r.score)}</span></div>`).join('')}</div>`).join('')}</div></div>`;
};

/* ---------- Innstillinger ---------- */
const SETTINGS = [['music', '🎵 Musikk i menyene', 'Musikken er alltid av under spill, så mikrofonen hører dere.'], ['sfx', '🔊 Lydeffekter', ''], ['readAloud', '🗣 Les opp stykkene i trening', 'I Fest leses de alltid opp.'], ['showAns', '👀 Vis fasit til den som venter', 'Gjelder Duell med annenhver tur.']];
RENDER.settings = () => {
  $('#setList').innerHTML = SETTINGS.map(([k, l, s]) => `<button class="toggle ${DB.settings[k] ? 'on' : ''}" data-tog="${k}"><span>${l}${s ? `<small>${s}</small>` : ''}</span><i></i></button>`).join('');
  $('#wipe').textContent = '🗑 Slett alle spillere og kamper'; $('#wipe').dataset.armed = '';
};
$('#setList').onclick = e => {
  const b = e.target.closest('[data-tog]'); if (!b) return;
  const k = b.dataset.tog; DB.settings[k] = !DB.settings[k]; save();
  if (k === 'music') { if (DB.settings.music) Music.start(); else Music.stop(); }
  sfx.click(); RENDER.settings();
};
$('#wipe').onclick = () => {
  const b = $('#wipe');
  if (!b.dataset.armed) { b.dataset.armed = '1'; b.textContent = 'Trykk igjen for å slette alt'; return; }
  const s = DB.settings; DB = freshDB(); DB.settings = s; seedPlayers(); save(); RENDER.settings();
};

/* =========================================================
   Oppstart: standardspillere, bakgrunn og intro
   ========================================================= */
function seedPlayers() {
  if (DB.players.length) return;
  let names = ['Spiller 1', 'Spiller 2'];
  try { const o = JSON.parse(localStorage.getItem('mattekamp') || 'null'); if (o && o.n1 && o.n2) names = [o.n1, o.n2]; } catch (e) {}
  names.forEach(n => DB.players.push(newProfile(n, 10)));
  try {   // ta med kamper fra forrige versjon
    const oldH = JSON.parse(localStorage.getItem('mattekamp_historikk') || '[]');
    if (!DB.history.length) DB.history = oldH.map(m => ({ t: m.t, mode: m.game === 'buzz' ? 'buzz' : 'tur', count: m.count,
      rows: m.players.map((p, i) => ({ name: p.name, av: null, score: m.game === 'buzz' ? `${p.points} poeng` : fmtTime(p.time), win: m.winner === i })) }));
  } catch (e) {}
  save();
}
seedPlayers();
$('#bgfx').innerHTML = Array.from({ length: 16 }, (_, i) => `<span style="left:${(i * 6.3 + rnd(5)) % 96}%; font-size:${26 + rnd(46)}px; animation-duration:${14 + rnd(16)}s; animation-delay:${-rnd(30)}s">${'+−×÷=%√7381π²'[i % 13]}</span>`).join('');
$('#intro .l1').innerHTML = [...'MATTE'].map((ch, i) => `<span style="animation-delay:${.15 + i * .12}s">${ch}</span>`).join('');
$('.introavs').innerHTML = Array.from({ length: 5 }, (_, i) => `<span class="av" style="animation-delay:${1.5 + i * .12}s, ${-i * .5}s">${avSVG(DB.players[i] ? DB.players[i].av : randAv())}</span>`).join('');
['8×8', '64', '7+5', '√81', '12', '9²'].forEach((t, i) => { const s = document.createElement('span'); s.className = 'eqfly'; s.textContent = t; s.style.cssText = `left:${8 + i * 15}%; top:${i % 2 ? 14 : 80}%; animation-delay:${1.8 + i * .5}s`; $('#intro').appendChild(s); });
let introGone = false;
$('#intro').addEventListener('click', () => {
  if (introGone) return; introGone = true;
  actx(); sfx.intro();
  $('#intro').classList.add('leave');
  setTimeout(() => { RENDER.home(); show('home'); }, 430);
});
</script>
</body>
</html>
