plugins {
    id 'com.android.application'
}

android {
    namespace 'no.mattekamp.app'
    compileSdk 34

    defaultConfig {
        applicationId 'no.mattekamp.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Fast testnøkkel i repoet, slik at nye versjoner kan installeres over gamle.
    // Den er bare for deling med familie og venner, ikke for Play Butikk.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
