name: Bygg Android-app (APK)

on:
  workflow_dispatch:
  push:
    paths:
      - "mattekamp.html"
      - "android/**"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Legg spillet inn i appen
        run: mkdir -p android/app/src/main/assets && cp mattekamp.html android/app/src/main/assets/mattekamp.html

      - name: Bygg APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Gi filen et navn
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Mattekamp.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Mattekamp-apk
          path: Mattekamp.apk
