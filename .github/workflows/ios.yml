name: Bygg iOS-app (usignert .ipa)

on:
  workflow_dispatch:
  push:
    paths:
      - "mattekamp.html"
      - "ios/**"
      - ".github/workflows/ios.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Lag Xcode-prosjekt
        working-directory: ios
        run: xcodegen generate

      - name: Bygg uten signering
        working-directory: ios
        run: |
          xcodebuild \
            -project Mattekamp.xcodeproj \
            -scheme Mattekamp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Pakk som .ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/Mattekamp.app Payload/
          zip -qry Mattekamp-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Mattekamp-unsigned-ipa
          path: ios/Mattekamp-unsigned.ipa
